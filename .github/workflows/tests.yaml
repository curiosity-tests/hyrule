name: Run tests
run-name: "Run tests ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  pull_request:
  push:

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  test:

    strategy:
      fail-fast: false
      matrix:
        python: [3.9, '3.10', 3.11, 3.12, 3.13, 3.14, pypy-3.11]

    name: ${{ matrix.python }}
    runs-on: ubuntu-latest
    env:
      TERM: xterm-256color
        # This is needed to avoid a terminfo-related crash when
        # testing PyPy.

    steps:
    - uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        lfs: false
    - name: Assert instrumentation is live
      if: env.CHALK_ON == 'true'
      continue-on-error: true
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python }}
    # Install dependencies. Test on Hy `master`, not the latest Hy
    # release.
    - run: pip install 'pytest >= 8.4.1' setuptools wheel git+https://github.com/hylang/hy@master
    # Be sure we're testing the installed version, instead of running
    # from the source tree. Use `--no-build-isolation` to ensure
    # Hy `master` is used to compile the bytecode.
    - run: pip install . --no-build-isolation && rm -r hyrule
    # Now we can run the tests.
    - run: pytest
